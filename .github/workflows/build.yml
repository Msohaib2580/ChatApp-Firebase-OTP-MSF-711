name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android Project
        id: find_project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -not -path "./.git/*" \
          -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "Gradle project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Project Structure
        run: |
          echo "Project directory:"
          echo "${{ steps.find_project.outputs.project_dir }}"

          echo ""
          echo "Files:"
          find "${{ steps.find_project.outputs.project_dir }}" -maxdepth 3 -type f | sort

      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
